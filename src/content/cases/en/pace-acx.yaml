title: A technical limitation turned into a design award
cardTitle: Problem Solving
description: >-
  The platform provided by the event organizers was built for images and text. We wouldn't be able
  to bring the interaction we most wanted to the booth — EngageNow — until I discovered that its
  rich text field would render raw HTML. That small opening changed what the booth could become.
