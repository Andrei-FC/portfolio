slug: pace-acx
order: 3
accent: pace
org: Grupo NGN
title: Uma limitação técnica que virou um projeto premiado
cardTitle: Resolução de problemas
description: >-
  A plataforma do evento aceitava basicamente imagens e texto. Parecia que não seria possível
  incluir no estande a interação que queríamos oferecer com o EngageNow, até eu descobrir que o
  campo de texto rico aceitava HTML. Essa brecha mudou o que era possível construir.
meta:
  role: Product Designer
  scope: Design e desenvolvimento front-end do estande, de ponta a ponta
  period: Outubro de 2020
  platforms: Cloud Conventions
cover:
  image: pace/1 - Engage now interaction.jpg
  alt: O estande finalizado, com a interação ao vivo do EngageNow
  caption: O estande finalizado, com interação ao vivo integrada à experiência.
stats: []
blocks:
  - type: decision
    size: l
    eyebrow: O BRIEFING
    title: Todos os expositores partiram das mesmas limitações
    columns:
      - >-
        Em outubro de 2020, uma feira do setor de telecomunicações precisou migrar às pressas para o
        formato virtual. A plataforma de eventos oferecia a todos os expositores a mesma estrutura.
        A demanda para o design era simples: produzir imagens JPG dos produtos para compor o
        estande.
      - >-
        Eu tinha poucos dias para concluir o trabalho. O caminho mais direto seria respeitar as
        limitações da plataforma e entregar as imagens. Antes disso, porém, quis entender o que ela
        realmente permitia fazer.
  - type: decision
    eyebrow: A BRECHA
    title: Investiguei o que a plataforma permitia fazer
    columns:
      - >-
        O HTML foi só o começo. Inspecionei a plataforma para descobrir quais elementos e estilos
        poderiam ser personalizados.


        A imagem de perfil, o fundo da página, espaçamentos e cores — detalhes que pareciam fixos —
        podiam ser customizados mirando os seletores da própria plataforma e aplicando meus estilos.
        Isso me deu controle sobre partes do estande que a interface padrão não expunha.
    plates:
      - image: pace/2 - Overriding the platform’s default styles.jpg
        alt: As classes CSS da própria plataforma mapeadas na folha de estilo
        caption: Classes CSS da plataforma identificadas e usadas para substituir os estilos padrão.
  - type: decision
    eyebrow: A SOLUÇÃO DE CONTORNO
    title: Como contornar a restrição ao JavaScript
    columns:
      - >-
        Qualquer <script> que eu colocasse no campo de texto rico saía como texto puro na página. O
        campo escapava o código, provavelmente por segurança, e a interação do EngageNow precisava
        de JavaScript para funcionar.


        Então tirei a lógica de dentro do campo. O script foi para um pequeno arquivo HTML num
        servidor externo, e o estande carregava esse arquivo por um iframe. O bloqueio parecia valer
        só para o que o próprio campo renderizava, então uma página carregada dentro de um iframe
        rodava normalmente.
    plates:
      - image: pace/3 - Integration Scheme.jpg
        alt: Diagrama da integração, com o JavaScript externo carregado por um iframe
        caption: Código JavaScript hospedado externamente e carregado no estande por um iframe.
  - type: decision
    eyebrow: A CONSTRUÇÃO
    title: Um estande virtual construído como um site
    columns:
      - >-
        Cuidei de todo o processo, do conceito ao código. Comecei no Adobe XD, desenhando o estande
        como uma experiência web, e depois desenvolvi tudo com HTML, CSS e JavaScript, em vez de
        entregar apenas um conjunto de imagens estáticas.


        O resultado foi uma experiência de estande totalmente customizada — desenhada, construída e
        adaptada para funcionar dentro das restrições da plataforma.
    plates:
      - image: pace/4 - A basic booth transformed into a living web experience.jpg
        alt: As três páginas do estande, construídas como um site dentro da plataforma
        caption: >-
          Três páginas e uma folha de estilos, funcionando dentro do campo de texto rico da
          plataforma.
  - type: decision
    eyebrow: O CUSTO
    title: Contornar a plataforma teve um preço
    columns:
      - >-
        O estande dependia de código escrito dentro de campos feitos para texto. Preservar esse
        código exigia uma sequência específica na hora de salvar, e qualquer ajuste pequeno de texto
        significava repetir o processo inteiro para garantir que tudo continuasse funcionando.
  - type: split
    eyebrow: RESULTADO
    title: Best in Show — e o único estande com interação ao vivo
    text: >-
      O estande recebeu o prêmio Best in Show, concedido por um júri independente do setor. Também
      foi o único da feira a permitir que visitantes clicassem para conversar ao vivo com alguém —
      uma interação por voz que não fazia parte dos recursos originais da plataforma.
    image: pace/best-in-show.png
    alt: Selo do prêmio Best in Show do PACE ACX Virtual 2020
  - type: decision
    size: l
    eyebrow: UMA COINCIDÊNCIA
    title: Um mês depois, o CEO da plataforma identificou o mesmo problema.
    columns:
      - >-
        Em 19 de novembro de 2020, algumas semanas depois da feira, a Convey anunciou o Cloud
        Exhibit, um estande virtual portátil que os expositores poderiam levar para diferentes
        eventos. Ao apresentar a solução, o CEO apontou limitações semelhantes: plataformas
        padronizadas, pouca influência dos expositores na escolha da tecnologia e pouco controle
        sobre marca, mensagem e interação.
      - Com poucas semanas de diferença, identificamos o mesmo problema, cada um de um lado da mesa.
    source:
      citation: “Convey Services Launches Cloud Exhibit” — AiThority, 19 de novembro de 2020
      url: aithority.com/it-and-devops/cloud/convey-services-launches-cloud-exhibit
      href: https://aithority.com/it-and-devops/cloud/convey-services-launches-cloud-exhibit/
