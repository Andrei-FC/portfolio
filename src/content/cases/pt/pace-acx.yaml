slug: pace-acx
order: 3
accent: pace
org: Grupo NGN
title: Uma limitação técnica virou um prêmio de design
cardTitle: Resolução de problemas
description: >-
  A plataforma fornecida pelos organizadores do evento foi feita para imagens e texto. Não
  conseguiríamos levar ao estande a interação que mais queríamos — o EngageNow — até eu descobrir
  que o campo de rich text renderizava HTML puro. Essa pequena brecha mudou o que o estande podia
  ser.
meta:
  role: Product Designer
  scope: Design do estande e front-end, do começo ao fim
  period: Outubro de 2020
  platforms: Cloud Conventions
