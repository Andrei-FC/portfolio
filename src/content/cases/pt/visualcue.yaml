slug: visualcue
order: 2
accent: cuefit
org: VisualCue
title: Cada novo cliente exigia uma implementação sob medida
cardTitle: Evolução de produto
description: >-
  Cada novo cliente exigia muito trabalho personalizado, tornando a implantação cara e difícil de
  escalar. O objetivo era criar um processo reutilizável e permitir que os próprios clientes
  configurassem a plataforma, sem precisar conhecer toda a complexidade técnica por trás dela.
meta:
  role: Product Designer
  scope: UX e UI de ponta a ponta, sistema de tiles e fluxo de dados
  period: 2020 — 2022
  platforms: Web · App desktop
cover:
  image: visualcue/1 - cover.jpg
  alt: O NGN Insights, com tiles configurados direto dentro do produto
  caption: "NGN Insights: tiles configuráveis diretamente na plataforma."
stats:
  - value: Implementação mais rápida
    label: 1+ mês → ~1 semana
  - value: Um sistema reutilizável
    label: Implementações personalizadas → Processo reutilizável
  - value: Configuração dentro do produto
    label: Implantação personalizada → Configuração na plataforma
blocks:
  - type: decision
    size: l
    eyebrow: O BRIEFING
    title: O produto funcionava bem. Difícil era colocá-lo em operação.
    columns:
      - >-
        Cada novo cliente exigia bastante trabalho personalizado da nossa equipe. Precisávamos criar
        os elementos visuais, preparar os dados e adaptar a solução ao ambiente de cada empresa.
        Isso encarecia a implantação e dificultava a expansão do produto.
      - >-
        A ideia era trazer esse trabalho para dentro do produto. Assim, o cliente poderia configurar
        a plataforma com facilidade, sem precisar lidar diretamente com a complexidade técnica do
        sistema.
  - type: decision
    eyebrow: ONDE COMEÇOU
    title: Uma linguagem visual feita sob medida para cada cliente
    columns:
      - >-
        O VisualCue apresentava dados em tiles personalizados, que combinavam ícones, cores e
        layouts. A linguagem visual era expressiva, mas difícil de reproduzir de forma consistente.
      - >-
        A personalização também se estendia à estrutura por trás da interface. Os dados precisavam
        ser preparados antes de chegar à plataforma, e até cálculos simples dependiam de
        desenvolvimento feito fora do produto.
    platesSideBySide: true
    plates:
      - image: visualcue/2.1 VisualCue Default Tiles.jpg
        alt: Tiles do VisualCue, cada um desenhado sob medida para os dados de um cliente
        caption: Cada cliente recebia tiles desenhados de acordo com seus dados e necessidades específicas.
      - image: visualcue/2.2 Illustrator Build Process.jpg
        alt: O processo de construção de um tile no Illustrator, camada por camada
        caption: >-
          Os tiles eram desenhados camada por camada no Illustrator e exportados por meio de um
          script. Cada nova variação exigia repetir esse processo manual.
  - type: note
    title: >-
      Conforme o VisualCue avançou para o mercado de call center, o produto evoluiu para CueFit — e
      sua linguagem visual precisava ficar mais focada e repetível.
  - type: decision
    eyebrow: CUEFIT
    title: De tiles personalizados a um sistema visual reutilizável
    columns:
      - >-
        Redesenhei a linguagem visual a partir de uma estrutura consistente. Assim, o mesmo sistema
        podia ser reutilizado em diferentes projetos, mantendo cada tile adequado ao dado que
        representava.
    plates:
      - image: visualcue/3 From custom tiles to a repeatable visual system.jpg
        alt: O tile redesenhado sobre uma estrutura de anel consistente
        caption: >-
          O anel criou uma estrutura comum para os tiles, enquanto o conteúdo e o status variavam
          conforme cada projeto.
  - type: note
    title: >-
      O Grupo NGN adquiriu o CueFit e a equipe responsável pelo produto. A partir daí, começamos a
      transformá-lo no que viria a ser o NGN Insights.
  - type: decision
    eyebrow: NGN INSIGHTS
    title: O sistema visual passou a fazer parte do produto
    columns:
      - >-
        Com a evolução do CueFit para NGN Insights, o sistema visual passou a fazer parte da própria
        plataforma. Os usuários podiam criar e configurar seus tiles sem depender de uma
        implementação feita pela equipe.
    plates:
      - image: >-
          visualcue/4 The final concept for a tile that could be configured directly inside the
          product.jpg
        alt: "O tile definido por áreas de conteúdo fixas: espaços de KPI, campos de texto e status"
        caption: >-
          O tile passou a ter áreas de conteúdo predefinidas: doze espaços para KPIs, quatro campos
          de texto e um indicador de status.
      - image: >-
          visualcue/5 The concept brought into the product, with the tile being built and configured
          directly in the platform.jpg
        alt: O editor de tiles, seguindo a mesma estrutura do tile
        caption: >-
          O editor seguia a estrutura do próprio tile e oferecia campos específicos para
          configuração, eliminando a necessidade de criar um layout novo para cada projeto.
  - type: decision
    eyebrow: IMPLEMENTAÇÃO
    title: Simplificando a configuração dos dados
    columns:
      - >-
        Tarefas que antes dependiam de desenvolvimento personalizado passaram a ser feitas
        visualmente dentro do produto. A interface permitia conectar, combinar e transformar dados,
        tornando a lógica do sistema mais acessível.
    plates:
      - image: visualcue/6 data base - data source - excel.jpg
        alt: Conexão de uma fonte de dados direto pela interface do produto
        caption: Era possível conectar e configurar uma fonte de dados diretamente pela interface.
      - image: visualcue/7. fields tipes.jpg
        alt: Mapeamento de campos, tipos e chaves na configuração
        caption: O processo de configuração permitia mapear campos, tipos de dados e chaves.
      - image: visualcue/8 Making data work simpler.jpg
        alt: Cálculos e comparações definidos pelo usuário dentro do produto
        caption: >-
          Os usuários podiam definir cálculos e comparações na própria plataforma, sem precisar
          solicitar uma etapa de desenvolvimento separada.
  - type: decision
    eyebrow: EXPERIÊNCIA DO AGENTE
    title: A experiência do agente passou a fazer parte do produto
    columns:
      - >-
        No NGN Insights, os agentes passaram a acompanhar seu desempenho com mais contexto,
        informações em tempo real e feedback dentro do próprio produto.
    plates:
      - image: visualcue/9 Agent Experience.jpg
        alt: A tela do agente, com a foto no centro do tile ao lado dos dados de performance
        caption: >-
          Com a estrutura do tile definida, também foi possível incluir a foto do agente ao lado dos
          dados de desempenho.
  - type: table
    eyebrow: EVOLUÇÃO DO PRODUTO
    columns:
      - Etapa
      - Produto
      - Sistema visual
      - Implementação
    rows:
      - - Ponto de partida
        - VisualCue
        - Artístico / altamente customizado
        - Trabalho sob medida
      - - Tornando repetível
        - CueFit
        - Sistema visual repetível
        - Trabalho sob medida
      - - Tornando configurável
        - NGN Insights
        - Sistema configurável no produto
        - Configuração no produto
  - type: media
    image: visualcue/10 Final Image.png
    alt: O NGN Insights em uso, fechando o case
